name: nanosvg
version: 1.0.0

authors:
  - Oleg Orlov <orelcokolov@gmail.com>

description: |
  Pure Crystal SVG parser and rasterizer, extended from NanoSVG.
  Started as a faithful port (byte-identical output on the test artwork)
  and goes beyond the C original: <use> with <defs> path templates and
  nested <svg> viewports, enough to render MathJax SVG output.
  No C extensions, no external dependencies.

license: Zlib
repository: https://github.com/OrelSokolov/nanosvg.cr
